weblate:
  api_url: https://hosted.weblate.org/api/
  project: ubuntu-desktop-translations

github:
  repository: canonical/firmware-updater

ai:
  api_url: https://openrouter.ai/api/v1
  model: google/gemini-3.8-flash

components:
  - weblate_component: firmware-updater
    source_locale: en
    context_locales: [de, fr, es]
    format: arb
    source_file: apps/firmware_updater/lib/l10n/app_en.arb
    path: apps/firmware_updater/lib/l10n/app_{locale}.arb
    push_after_commit: false